<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Anime Hero Banner - Phạm Trần Anh Quân">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#121226" />
      <stop offset="100%" stop-color="#18132e" />
    </linearGradient>

    <!-- Sakura Neon Border & Wave Gradient -->
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#c084fc;#38bdf8;#f472b6" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#fbcfe8" />
      <stop offset="65%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#f472b6;#c084fc" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#f472b6;#c084fc;#38bdf8" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Neon Glow Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Petal Gradients -->
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="60%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="petalGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="sakuraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Container with Rounded Corners -->
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#bgGrad)" stroke="url(#sakuraGrad)" stroke-width="2" />

  <!-- Background Ambient Cyber Aura Orbs -->
  <circle cx="200" cy="80" r="140" fill="#f472b6" opacity="0.08" filter="url(#sakuraGlow)">
    <animate attributeName="r" values="120;160;120" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="240" r="160" fill="#a855f7" opacity="0.1" filter="url(#sakuraGlow)">
    <animate attributeName="r" values="140;180;140" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="160" r="180" fill="#38bdf8" opacity="0.05" filter="url(#sakuraGlow)" />

  <!-- Tech Grid Background Lines (Anime HUD Grid) -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
    <line x1="1120" y1="0" x2="1120" y2="320" />
    <line x1="0" y1="60" x2="1200" y2="60" stroke-dasharray="8 8" />
    <line x1="0" y1="260" x2="1200" y2="260" stroke-dasharray="8 8" />
  </g>

  <!-- Flowing Sine Waves (Stream of Energy) -->
  <path d="M 0 240 Q 300 200, 600 250 T 1200 230" fill="none" stroke="url(#sakuraGrad)" stroke-width="2" opacity="0.35" filter="url(#softGlow)">
    <animate attributeName="d" values="M 0 240 Q 300 200, 600 250 T 1200 230; M 0 220 Q 300 260, 600 220 T 1200 250; M 0 240 Q 300 200, 600 250 T 1200 230" dur="8s" repeatCount="indefinite" />
  </path>
  <path d="M 0 250 Q 350 280, 700 230 T 1200 260" fill="none" stroke="url(#sakuraGrad)" stroke-width="1.2" opacity="0.2">
    <animate attributeName="d" values="M 0 250 Q 350 280, 700 230 T 1200 260; M 0 260 Q 350 220, 700 270 T 1200 240; M 0 250 Q 350 280, 700 230 T 1200 260" dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Corner Anime HUD Accents -->
  <path d="M 24 50 L 24 24 L 50 24" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
  <path d="M 1176 50 L 1176 24 L 1150 24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <path d="M 24 270 L 24 296 L 50 296" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
  <path d="M 1176 270 L 1176 296 L 1150 296" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />

  <!-- Animated Floating Sakura Petals -->
  <!-- Petal A1 (Left Drift) -->
  <g transform="translate(110, 80)">
    <path d="M 0 0 C -6 -12 -12 -18 0 -28 C 12 -18 6 -12 0 0 Z" fill="url(#petalGrad1)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 80; 90 170" dur="9s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="0; 60; 120" dur="9s" repeatCount="indefinite" additive="sum" />
      <animate attributeName="opacity" values="0; 0.9; 0.8; 0" dur="9s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Petal A2 (Left Upper Sway) -->
  <g transform="translate(240, 40)">
    <path d="M 0 0 C -5 -10 -9 -15 0 -22 C 9 -15 5 -10 0 0 Z" fill="url(#petalGrad2)" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0 0; 30 70; 70 140" dur="11s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="-20; 45; 100" dur="11s" repeatCount="indefinite" additive="sum" />
      <animate attributeName="opacity" values="0; 0.85; 0.7; 0" dur="11s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Petal A3 (Right Top Falling) -->
  <g transform="translate(980, 50)">
    <path d="M 0 0 C -7 -13 -13 -20 0 -30 C 13 -20 7 -13 0 0 Z" fill="url(#petalGrad1)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0; -50 90; -110 180" dur="8.5s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="40; -30; -90" dur="8.5s" repeatCount="indefinite" additive="sum" />
      <animate attributeName="opacity" values="0; 0.9; 0.85; 0" dur="8.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Petal A4 (Right Lower Drift) -->
  <g transform="translate(1080, 140)">
    <path d="M 0 0 C -5 -9 -9 -14 0 -20 C 9 -14 5 -9 0 0 Z" fill="url(#petalGrad3)" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0; -35 60; -80 120" dur="10s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="-10; -70; -130" dur="10s" repeatCount="indefinite" additive="sum" />
      <animate attributeName="opacity" values="0; 0.8; 0.6; 0" dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Petal A5 (Center subtle) -->
  <g transform="translate(520, 20)">
    <path d="M 0 0 C -4 -8 -8 -12 0 -18 C 8 -12 4 -8 0 0 Z" fill="url(#petalGrad2)" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 80; 90 160" dur="12s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="10; 90; 180" dur="12s" repeatCount="indefinite" additive="sum" />
      <animate attributeName="opacity" values="0; 0.75; 0.5; 0" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Anime Twinkling Sparkles (4-Point Stars) -->
  <g transform="translate(180, 70)" filter="url(#softGlow)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#ffe4e6">
      <animateTransform attributeName="transform" type="scale" values="0.7; 1.4; 0.7" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <g transform="translate(1040, 80)" filter="url(#softGlow)">
    <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#bae6fd">
      <animateTransform attributeName="transform" type="scale" values="1.3; 0.6; 1.3" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9; 0.3; 0.9" dur="3.5s" repeatCount="indefinite" />
    </path>
  </g>

  <g transform="translate(320, 250)" filter="url(#softGlow)">
    <path d="M 0 -9 Q 0 0 9 0 Q 0 0 0 9 Q 0 0 -9 0 Q 0 0 0 -9 Z" fill="#fbcfe8">
      <animateTransform attributeName="transform" type="scale" values="0.8; 1.3; 0.8" dur="2.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3; 0.95; 0.3" dur="2.7s" repeatCount="indefinite" />
    </path>
  </g>

  <g transform="translate(900, 240)" filter="url(#softGlow)">
    <path d="M 0 -9 Q 0 0 9 0 Q 0 0 0 9 Q 0 0 -9 0 Q 0 0 0 -9 Z" fill="#c4b5fd">
      <animateTransform attributeName="transform" type="scale" values="1.2; 0.7; 1.2" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.85; 0.35; 0.85" dur="3.2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Center Content Group -->
  <g transform="translate(600, 0)">
    <!-- Top Pill Badge: Anime Lore Arc -->
    <g transform="translate(0, 48)">
      <rect x="-170" y="-15" width="340" height="30" rx="15" fill="#18182e" fill-opacity="0.9" stroke="url(#sakuraGrad)" stroke-width="1.2" filter="url(#softGlow)" />
      <!-- Pulsing Dot -->
      <circle cx="-145" cy="0" r="4" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-132" y="4" fill="#6ee7b7" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="10" font-weight="700" letter-spacing="1.5">ONLINE</text>
      <text x="12" y="4" text-anchor="middle" fill="#fbcfe8" font-family="'Zen Maru Gothic', 'Hiragino Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="2.5">
        ✧ 桜舞う開発の道 · DEVELOPER ARC ✧
      </text>
    </g>

    <!-- Hero Japanese Title Accent -->
    <text x="0" y="112" text-anchor="middle" fill="#c084fc" font-family="'Zen Maru Gothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" font-weight="600" letter-spacing="6" opacity="0.85">
      「 コードに命を吹き込む .NET エンジニア 」
      <animate attributeName="opacity" values="0.7; 1; 0.7" dur="4s" repeatCount="indefinite" />
    </text>

    <!-- Hero Name: Phạm Trần Anh Quân -->
    <g transform="translate(0, 168)">
      <text x="0" y="0" text-anchor="middle" fill="url(#titleGrad)" font-family="'Montserrat', 'Zen Maru Gothic', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="3" filter="url(#softGlow)">
        PHẠM TRẦN ANH QUÂN
      </text>
    </g>

    <!-- Subtitle: Role & Core Stack -->
    <text x="0" y="210" text-anchor="middle" fill="#93c5fd" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13.5" font-weight="600" letter-spacing="4">
      .NET SOFTWARE DEVELOPER · ASP.NET CORE · SQL SERVER · VUE.JS
    </text>

    <!-- Bottom Motto Pill Card -->
    <g transform="translate(0, 260)">
      <rect x="-300" y="-16" width="600" height="32" rx="16" fill="#131322" fill-opacity="0.85" stroke="#f472b6" stroke-opacity="0.5" stroke-width="1" />
      <text x="0" y="4.5" text-anchor="middle" fill="#fce7f3" font-family="'Segoe UI', sans-serif" font-size="11.5" font-style="italic" letter-spacing="1">
        "Code like a final episode: focused, polished, and worth the wait."
      </text>
    </g>
  </g>
</svg>
