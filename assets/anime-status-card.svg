<svg xmlns="http://www.w3.org/2000/svg" width="950" height="380" viewBox="0 0 950 380" role="img" aria-label="Anime RPG Developer Status Card">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e1a" />
      <stop offset="50%" stop-color="#14142b" />
      <stop offset="100%" stop-color="#1c1636" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- HP Bar Gradient -->
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- MP Bar Gradient -->
    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- EXP Bar Gradient -->
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Skill Bar Gradient -->
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Outer Frame -->
  <rect x="2" y="2" width="946" height="376" rx="20" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Corner Tech HUD Accents -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />
  <path d="M 930 40 L 930 20 L 910 20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <path d="M 20 340 L 20 360 L 40 360" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
  <path d="M 930 340 L 930 360 L 910 360" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" />

  <!-- Card Header Strip -->
  <g transform="translate(36, 32)">
    <!-- Header Icon & Status Title -->
    <rect x="0" y="0" width="878" height="46" rx="10" fill="#1b1a33" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1" />
    
    <text x="20" y="28" fill="#fbcfe8" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="14" font-weight="700" letter-spacing="2">
      ⚔️ CHARACTER STATUS // DEVELOPER SHEET
    </text>

    <!-- Class & Level Pills -->
    <g transform="translate(540, 10)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#242145" stroke="#c084fc" stroke-width="1" />
      <text x="90" y="17" text-anchor="middle" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
        CLASS: .NET SORCERER
      </text>
    </g>

    <g transform="translate(735, 10)">
      <rect x="0" y="0" width="125" height="26" rx="13" fill="#242145" stroke="#38bdf8" stroke-width="1" />
      <text x="62" y="17" text-anchor="middle" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
        LV. 21 (SD21305)
      </text>
    </g>
  </g>

  <!-- Left Column: Core Vitals (HP / MP / EXP / Guild) -->
  <g transform="translate(45, 102)">
    <!-- Section Title -->
    <text x="0" y="14" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">
      ▶ VITAL METRICS
    </text>

    <!-- HP Bar -->
    <g transform="translate(0, 30)">
      <text x="0" y="12" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">HP [Clean Code &amp; Stamina]</text>
      <text x="390" y="12" text-anchor="end" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">9,999 / 9,999</text>
      <rect x="0" y="20" width="390" height="12" rx="6" fill="#1a1829" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1" />
      <rect x="0" y="20" width="390" height="12" rx="6" fill="url(#hpGrad)">
        <animate attributeName="width" values="320;390;320" dur="6s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- MP Bar -->
    <g transform="translate(0, 80)">
      <text x="0" y="12" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">MP [Algorithm &amp; Problem Solving]</text>
      <text x="390" y="12" text-anchor="end" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">8,800 / 8,800</text>
      <rect x="0" y="20" width="390" height="12" rx="6" fill="#1a1829" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
      <rect x="0" y="20" width="380" height="12" rx="6" fill="url(#mpGrad)">
        <animate attributeName="width" values="340;380;340" dur="7s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- EXP Bar -->
    <g transform="translate(0, 130)">
      <text x="0" y="12" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">EXP [Progress to Senior Fullstack]</text>
      <text x="390" y="12" text-anchor="end" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">88.5%</text>
      <rect x="0" y="20" width="390" height="12" rx="6" fill="#1a1829" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <rect x="0" y="20" width="345" height="12" rx="6" fill="url(#expGrad)">
        <animate attributeName="width" values="310;345;310" dur="8s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Lore Info -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="390" height="52" rx="8" fill="#18172e" stroke="#c084fc" stroke-opacity="0.25" stroke-width="1" />
      <text x="12" y="22" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11.5">
        🏛️ <tspan fill="#fbcfe8" font-weight="600">Guild:</tspan> FPT Polytechnic College (.NET Specialization)
      </text>
      <text x="12" y="40" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11.5">
        🎯 <tspan fill="#7dd3fc" font-weight="600">Quest:</tspan> Crafting robust, scalable &amp; high-impact systems
      </text>
    </g>
  </g>

  <!-- Middle Divider Line -->
  <line x1="480" y1="95" x2="480" y2="350" stroke="#f472b6" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Right Column: Tech Mastery & Skills -->
  <g transform="translate(515, 102)">
    <!-- Section Title -->
    <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">
      ▶ SKILL TREES &amp; MASTERY
    </text>

    <!-- Skill 1: C# & ASP.NET Core -->
    <g transform="translate(0, 30)">
      <text x="0" y="12" fill="#fbcfe8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">⚡ .NET 10 &amp; ASP.NET Core APIs</text>
      <text x="390" y="12" text-anchor="end" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">95%</text>
      <rect x="0" y="20" width="390" height="10" rx="5" fill="#1a1829" />
      <rect x="0" y="20" width="370" height="10" rx="5" fill="url(#skillGrad)" filter="url(#neonFilter)" />
    </g>

    <!-- Skill 2: SQL Server & EF Core -->
    <g transform="translate(0, 78)">
      <text x="0" y="12" fill="#fbcfe8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">💾 SQL Server &amp; EF Core Data Flow</text>
      <text x="390" y="12" text-anchor="end" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">90%</text>
      <rect x="0" y="20" width="390" height="10" rx="5" fill="#1a1829" />
      <rect x="0" y="20" width="351" height="10" rx="5" fill="url(#skillGrad)" filter="url(#neonFilter)" />
    </g>

    <!-- Skill 3: Vue.js & Frontend Tooling -->
    <g transform="translate(0, 126)">
      <text x="0" y="12" fill="#fbcfe8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">🎨 Vue.js &amp; Responsive UI</text>
      <text x="390" y="12" text-anchor="end" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">82%</text>
      <rect x="0" y="20" width="390" height="10" rx="5" fill="#1a1829" />
      <rect x="0" y="20" width="320" height="10" rx="5" fill="url(#skillGrad)" filter="url(#neonFilter)" />
    </g>

    <!-- Skill 4: Architecture & AI Integration -->
    <g transform="translate(0, 174)">
      <text x="0" y="12" fill="#fbcfe8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">🤖 AI Advisory &amp; RAG Workflows</text>
      <text x="390" y="12" text-anchor="end" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">88%</text>
      <rect x="0" y="20" width="390" height="10" rx="5" fill="#1a1829" />
      <rect x="0" y="20" width="343" height="10" rx="5" fill="url(#skillGrad)" filter="url(#neonFilter)" />
    </g>

    <!-- Traits Badges -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="#201a38" stroke="#f472b6" stroke-width="1" />
      <text x="60" y="15" text-anchor="middle" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">✧ FAST LEARNER</text>

      <rect x="130" y="0" width="125" height="22" rx="11" fill="#201a38" stroke="#c084fc" stroke-width="1" />
      <text x="192" y="15" text-anchor="middle" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">✧ TEAM PLAYER</text>

      <rect x="265" y="0" width="125" height="22" rx="11" fill="#201a38" stroke="#38bdf8" stroke-width="1" />
      <text x="327" y="15" text-anchor="middle" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">✧ PROBLEM SOLVER</text>
    </g>
  </g>
</svg>
