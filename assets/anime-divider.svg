<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-label="Anime Sakura Divider">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#fbcfe8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <filter id="sakuraGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Flowing Sine Waves -->
  <path d="M 40 50 C 220 18, 360 82, 540 50 C 720 18, 860 82, 1040 50 C 1110 36, 1140 46, 1160 50" fill="none" stroke="url(#sakuraGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#sakuraGlow)">
    <animate attributeName="stroke-width" values="2;3.2;2" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M 100 52 C 280 78, 420 22, 600 52 C 780 82, 920 26, 1100 52" fill="none" stroke="url(#sakuraGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Animated Floating Sakura Petals -->
  <!-- Petal 1 (Left) -->
  <g transform="translate(160, 38)">
    <path d="M 0 0 C -5 -9 -9 -14 0 -22 C 9 -14 5 -9 0 0 Z" fill="url(#petalGrad1)" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" values="-25; 15; -25" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
  <!-- Petal 2 (Left Lower) -->
  <g transform="translate(280, 64)">
    <path d="M 0 0 C -4 -7 -7 -11 0 -17 C 7 -11 4 -7 0 0 Z" fill="url(#petalGrad2)" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" values="40; -10; 40" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5; 0.95; 0.5" dur="3.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Petal 3 (Right) -->
  <g transform="translate(1020, 40)">
    <path d="M 0 0 C -5 -9 -9 -14 0 -22 C 9 -14 5 -9 0 0 Z" fill="url(#petalGrad1)" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" values="30; -20; 30" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="4s" repeatCount="indefinite" />
    </path>
  </g>
  <!-- Petal 4 (Right Lower) -->
  <g transform="translate(910, 62)">
    <path d="M 0 0 C -4 -7 -7 -11 0 -17 C 7 -11 4 -7 0 0 Z" fill="url(#petalGrad2)" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" values="-15; 35; -15" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="3.2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Sparkles / Anime Stars -->
  <g transform="translate(210, 28)" filter="url(#sakuraGlow)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#ffe4e6">
      <animateTransform attributeName="transform" type="scale" values="0.8; 1.25; 0.8" dur="2.5s" repeatCount="indefinite" additive="sum" />
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.5s" repeatCount="indefinite" />
    </path>
  </g>
  <g transform="translate(970, 30)" filter="url(#sakuraGlow)">
    <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z" fill="#bae6fd">
      <animateTransform attributeName="transform" type="scale" values="1.2; 0.7; 1.2" dur="3s" repeatCount="indefinite" additive="sum" />
      <animate attributeName="opacity" values="0.9; 0.35; 0.9" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Center Badge / Japanese Kanji & Text -->
  <g transform="translate(600, 50)">
    <rect x="-195" y="-20" width="390" height="40" rx="20" fill="#111022" fill-opacity="0.95" stroke="url(#sakuraGrad)" stroke-width="1.3" filter="url(#sakuraGlow)" />
    
    <text x="0" y="-3" text-anchor="middle" dominant-baseline="middle" fill="#fbcfe8" font-family="'Zen Maru Gothic', 'Hiragino Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="3">
      ✧ 桜の季節 · SLICE OF LIFE ARC ✧
      <animate attributeName="opacity" values="0.8; 1; 0.8" dur="3.5s" repeatCount="indefinite" />
    </text>
    <text x="0" y="11" text-anchor="middle" dominant-baseline="middle" fill="#c4b5fd" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="9.5" font-weight="500" letter-spacing="3">
      dev to the end · 穏やかな日々
    </text>
  </g>
</svg>
