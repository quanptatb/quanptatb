<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">Phạm Trần Anh Quân</title>
  <desc id="desc">dev to the end</desc>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#fb7185" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="6s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="120" rx="18" fill="#0f172a" />
  <path d="M55 64 C220 18 330 104 494 56 C670 5 780 112 945 58 C1038 28 1118 44 1145 55" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="stroke-width" values="3;5;3" dur="3.4s" repeatCount="indefinite" />
  </path>
  <path d="M84 70 H1116" fill="none" stroke="url(#neon)" stroke-width="1.5" stroke-linecap="round" opacity="0.45">
    <animate attributeName="opacity" values="0.2;0.65;0.2" dur="4s" repeatCount="indefinite" />
  </path>

  <g filter="url(#glow)">
    <path d="M156 31 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z" fill="#f9a8d4">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.2s" repeatCount="indefinite" />
    </path>
    <path d="M1028 35 l6 13 15 2 -11 10 3 15 -13 -8 -13 8 3 -15 -11 -10 15 -2z" fill="#bfdbfe">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.8s" repeatCount="indefinite" />
    </path>
    <circle cx="296" cy="32" r="4" fill="#fde68a">
      <animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="884" cy="88" r="5" fill="#67e8f9">
      <animate attributeName="r" values="4;7;4" dur="3.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.1s" repeatCount="indefinite" />
    </circle>
  </g>

  <text x="600" y="63" text-anchor="middle" dominant-baseline="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5">
    dev to the end
    <animate attributeName="opacity" values="0.72;1;0.72" dur="3s" repeatCount="indefinite" />
  </text>
</svg>
